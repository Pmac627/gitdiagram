technical_nouns:
  - term: GitDiagram
    meaning: the web app that makes repository architecture diagrams and videos
  - term: repository
    meaning: a GitHub repository selected by a visitor
  - term: diagram
    meaning: a Mermaid architecture graph for a repository
  - term: source excerpt
    meaning: a bounded part of a repository source file sent to a model
  - term: artifact
    meaning: a saved diagram or video result
  - term: browse index
    meaning: the list of public diagram artifacts for browsing
  - term: session audit
    meaning: the saved summary of one diagram generation attempt
  - term: explainer video
    meaning: a generated film about a repository
  - term: operator dashboard
    meaning: the admin page for the voice balance
  - term: SQLite
    meaning: the embedded database in the file gitdiagram.db
  - term: data folder
    meaning: the folder that DATA_DIR names, which holds the database and all saved files
    unapproved: [data directory, storage root]
  - term: object store
    meaning: the module that saves diagram artifacts as files under the data folder
  - term: bucket
    meaning: a top-level folder of the object store, either public or private
  - term: etag
    meaning: the SHA-256 digest of the stored bytes of an object
  - term: lock
    meaning: a row in the locks table that lets one holder work at a time
  - term: paid run
    meaning: a video generation that has made its first model call
  - term: voice pause
    meaning: the automatic stop of new videos while the narrator has no credit
    unapproved: [kill switch]
  - term: migration
    meaning: a numbered change to the database schema
  - term: schema version
    meaning: the user_version number of the database
  - term: gallery index
    meaning: the video_index table with one card for each video
  - term: route
    meaning: a Next.js HTTP Route Handler
  - term: request
    meaning: an HTTP request accepted by a route
  - term: origin
    meaning: the scheme and host of an HTTP or WebSocket URL
  - term: caller
    meaning: a browser or service that sends a request
  - term: state
    meaning: the saved diagram, control, or session data used by a route
  - term: event
    meaning: a typed message sent through a stream
  - term: build
    meaning: the compiled Next.js app
  - term: port
    meaning: the TCP port of the app server
  - term: effort
    meaning: the reasoning effort selected for a model request
  - term: progress
    meaning: generation or render status sent to the browser
  - term: film
    meaning: the explainer video plan and its media
  - term: Mermaid
  - term: GitHub
  - term: OpenRouter
  - term: Upstash
  - term: probe
    meaning: the small test app in deploy/spike that checked the host
  - term: log
    meaning: the text file or stream where the app writes event lines
  - term: environment variable
    meaning: a named value in the process environment
    unapproved: [env var]
  - term: IIS
    meaning: Internet Information Services, the Windows web server of the host
  - term: standalone output
    meaning: the self-contained server.js build that Next.js writes in .next/standalone
  - term: package
    meaning: the zip file that scripts/package-iis.ps1 makes for the host
  - term: app pool
    meaning: the IIS process group that runs the site and holds its environment variables
technical_verbs:
  - term: run
    meaning: start a command or task
  - term: extract
    meaning: unpack the files of a zip into a folder
  - term: restore
    meaning: put saved files back in place
  - term: generate
    meaning: create a diagram or video from repository data
  - term: render
    meaning: make a video file or a browser diagram from a plan
  - term: coordinate
    meaning: orchestrate concurrent generation or render work
